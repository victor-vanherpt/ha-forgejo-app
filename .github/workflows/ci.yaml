name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5.2.2

      - name: Lint
        run: mise run lint

      - name: Lint app
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: ./forgejo

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: jq yq

      - name: Check version (pull request)
        if: github.event_name == 'pull_request'
        run: mise run version:check --base "origin/${GITHUB_BASE_REF}"

      - name: Check version (release commit)
        if: github.event_name == 'push'
        run: mise run version:check

      - name: Decide whether to release
        id: release
        if: github.event_name == 'push'
        run: |
          version=$(yq '.version' forgejo/config.yaml)
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null; then
            echo "::notice::${version} is already released, not publishing again"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.info.outputs.image_name }}
      registry_prefix: ${{ steps.info.outputs.registry_prefix }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get app information
        id: info
        run: |
          image=$(yq '.image' forgejo/config.yaml)
          {
            echo "architectures=$(yq -o=json -I=0 '.arch' forgejo/config.yaml)"
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=$(yq '.version' forgejo/config.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [prepare, version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    env:
      PUBLISH: ${{ github.event_name == 'push' && needs.version.outputs.release == 'true' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./forgejo
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          load: true
          version: ${{ needs.prepare.outputs.version }}

      - name: Set up mise
        uses: jdx/mise-action@v5.2.2
        with:
          install_args: jq

      - name: Smoke test (SQLite)
        run: mise run test "${{ matrix.image }}:${{ needs.prepare.outputs.version }}"

      - name: Smoke test (PostgreSQL)
        if: matrix.arch == 'amd64'
        run: mise run test --db postgres "${{ matrix.image }}:${{ needs.prepare.outputs.version }}"

      - name: Smoke test (MariaDB app)
        if: matrix.arch == 'amd64'
        run: mise run test --db mysql "${{ matrix.image }}:${{ needs.prepare.outputs.version }}"

      # Same build, served from the cache filled above, now pushed and signed
      - name: Publish image
        if: env.PUBLISH == 'true'
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./forgejo
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          push: true
          version: ${{ needs.prepare.outputs.version }}

  release:
    name: Release
    needs: [lint, version, prepare, build]
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v heading="## ${VERSION}" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' forgejo/CHANGELOG.md > notes.md
          gh release create "${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file notes.md \
            --latest
