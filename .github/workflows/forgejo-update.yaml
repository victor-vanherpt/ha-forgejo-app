name: Forgejo update

# Nightly: pin the latest stable Forgejo release on top of main and open a PR,
# or refresh the open one (e.g. when main moved and the version needs a bump).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgejo-update

jobs:
  update:
    name: Check for a new Forgejo release
    runs-on: ubuntu-latest
    # Writes go through FORGEJO_UPDATE_TOKEN, because PRs created with
    # GITHUB_TOKEN don't start CI. Only the step that pushes and opens the PR
    # gets the token; nothing else in this job can write to the repository.
    permissions:
      contents: read
    env:
      BRANCH: forgejo-update
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: jq yq

      - name: Pin the latest Forgejo release
        id: pin
        run: |
          current=$(sed -n 's/^ARG FORGEJO_VERSION=//p' forgejo/Dockerfile)
          mise run forgejo:pin
          latest=$(sed -n 's/^ARG FORGEJO_VERSION=//p' forgejo/Dockerfile)
          if [[ "${latest}" == "${current}" ]]; then
            echo "Forgejo ${current} is the latest stable release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "current=${current}"
            echo "latest=${latest}"
            echo "version=$(yq '.version' forgejo/config.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.pin.outputs.current }}
          GH_TOKEN: ${{ secrets.FORGEJO_UPDATE_TOKEN }}
          LATEST: ${{ steps.pin.outputs.latest }}
          VERSION: ${{ steps.pin.outputs.version }}
        run: |
          title="Update Forgejo to ${LATEST}"
          git switch -c "${BRANCH}"
          git add -A
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "${title}"

          # Only push when this differs from what the branch already proposes.
          # An up-to-date branch is only done with if a PR was opened for that
          # commit: an earlier run can have pushed it and then failed to open
          # the PR. A closed PR counts, so closing one skips that update.
          if git fetch -q origin "${BRANCH}" 2> /dev/null && git diff --quiet FETCH_HEAD HEAD; then
            branch_sha=$(git rev-parse FETCH_HEAD)
            proposed=$(gh pr list --head "${BRANCH}" --state all --json headRefOid \
              --jq "map(select(.headRefOid == \"${branch_sha}\")) | length")
            if [[ "${proposed}" != "0" ]]; then
              echo "The ${BRANCH} branch is up to date"
              exit 0
            fi
            echo "The ${BRANCH} branch has no pull request yet"
          else
            git push -q -f \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi

          workflow="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/.github/workflows/forgejo-update.yaml"
          body="Updates Forgejo from ${CURRENT} to ${LATEST} (app version ${VERSION}).

          Check the [release notes](https://codeberg.org/forgejo/forgejo/releases/tag/v${LATEST}) before
          merging: Forgejo sometimes advises against upgrading to a release.

          Opened by the nightly [Forgejo update](${workflow}) workflow."
          if [[ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]]; then
            gh pr edit "${BRANCH}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body "${body}"
          fi
