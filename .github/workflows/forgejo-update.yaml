name: Forgejo update

# Nightly: pin the latest stable Forgejo release on top of main and open a PR,
# or replace the open one (e.g. when main moved and the version needs a bump).
# Nothing here can change main: you merge the PR.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgejo-update

env:
  BRANCH: forgejo-update

jobs:
  pin:
    name: Check for a new Forgejo release
    runs-on: ubuntu-latest
    # Read-only: this job runs third-party tooling (mise, jq, yq).
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.pin.outputs.changed }}
      base: ${{ steps.pin.outputs.base }}
      current: ${{ steps.pin.outputs.current }}
      latest: ${{ steps.pin.outputs.latest }}
      version: ${{ steps.pin.outputs.version }}
      patch: ${{ steps.pin.outputs.patch }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: jq yq

      - name: Pin the latest Forgejo release
        id: pin
        run: |
          current=$(sed -n 's/^ARG FORGEJO_VERSION=//p' forgejo/Dockerfile)
          mise run forgejo:pin
          latest=$(sed -n 's/^ARG FORGEJO_VERSION=//p' forgejo/Dockerfile)
          if [[ "${latest}" == "${current}" ]]; then
            echo "Forgejo ${current} is the latest stable release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          {
            echo "changed=true"
            echo "base=$(git rev-parse HEAD)"
            echo "current=${current}"
            echo "latest=${latest}"
            echo "version=$(yq '.version' forgejo/config.yaml)"
            echo "patch=$(git diff --cached --binary | base64 -w0)"
          } >> "$GITHUB_OUTPUT"

  propose:
    name: Open the pull request
    needs: pin
    if: needs.pin.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # The job token pushes the update branch; the ruleset on main keeps it off
    # main. FORGEJO_UPDATE_TOKEN only opens the PR (PRs opened with the job
    # token don't start CI) and has no Contents permission, so it can't push
    # or merge. No third-party code runs in this job.
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.base }}
          persist-credentials: false

      - name: Commit the update
        env:
          LATEST: ${{ needs.pin.outputs.latest }}
          PATCH: ${{ needs.pin.outputs.patch }}
        run: |
          git switch -c "${BRANCH}"
          base64 -d <<< "${PATCH}" | git apply --index
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update Forgejo to ${LATEST}"

      # Only push when this differs from what the branch already proposes. An
      # up-to-date branch is only done with if a PR was opened for that commit:
      # an earlier run can have pushed it and then failed to open the PR. A
      # closed PR counts, so closing one skips that update.
      #
      # A changed branch is deleted and pushed anew rather than force-pushed:
      # pushes with the job token don't start CI on an open PR, and the job
      # token may not move a branch across main's workflow changes. Deleting the
      # branch closes its PR; the next step opens a new one.
      - name: Push the update branch
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha=""
          if git fetch -q origin "${BRANCH}" 2> /dev/null; then
            branch_sha=$(git rev-parse FETCH_HEAD)
          fi
          if [[ -n "${branch_sha}" ]] && git diff --quiet "${branch_sha}" HEAD; then
            proposed=$(gh pr list --head "${BRANCH}" --state all --json headRefOid \
              --jq "map(select(.headRefOid == \"${branch_sha}\")) | length")
            if [[ "${proposed}" != "0" ]]; then
              echo "The ${BRANCH} branch is up to date"
              echo "open=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "The ${BRANCH} branch has no pull request yet"
          else
            if [[ -n "${branch_sha}" ]]; then
              echo "Replacing the outdated ${BRANCH} branch"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
            fi
            git push -q \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          fi
          echo "open=true" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.push.outputs.open == 'true'
        env:
          CURRENT: ${{ needs.pin.outputs.current }}
          GH_TOKEN: ${{ secrets.FORGEJO_UPDATE_TOKEN }}
          LATEST: ${{ needs.pin.outputs.latest }}
          VERSION: ${{ needs.pin.outputs.version }}
        run: |
          workflow="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/.github/workflows/forgejo-update.yaml"
          body="Updates Forgejo from ${CURRENT} to ${LATEST} (app version ${VERSION}).

          Check the [release notes](https://codeberg.org/forgejo/forgejo/releases/tag/v${LATEST}) before
          merging: Forgejo sometimes advises against upgrading to a release.

          Opened by the nightly [Forgejo update](${workflow}) workflow."
          gh pr create --base main --head "${BRANCH}" --title "Update Forgejo to ${LATEST}" --body "${body}"
